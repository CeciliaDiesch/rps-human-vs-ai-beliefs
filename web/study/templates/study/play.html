{% load static %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schere – Stein – Papier</title>
  <style>
    [hidden] { display: none !important; }  /* hidden must win over display rules below */
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; text-align: center; }
    header { display: flex; justify-content: space-between; font-size: 18px; }
    #round { color: #666; }
    #stage { height: 330px; display: flex; flex-direction: column; justify-content: center; }
    #word { font-size: 40px; min-height: 50px; }
    #bar-box { width: 300px; max-width: 80%; height: 14px; margin: 16px auto 0; border: 1px solid #999; visibility: hidden; }
    #bar { height: 100%; width: 100%; background: #333; }
    .field { width: 120px; height: 150px; margin: 8px auto; }
    .field img, .gesture img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .gesture { position: relative; width: 110px; padding: 6px; margin: 8px; background: white; border: 3px solid #ccc; border-radius: 8px; cursor: pointer; }
    .gesture img { height: 130px; }
    .gesture span { font-size: 15px; }
    .gesture.chosen { border-color: #1e6bd6; transform: scale(1.1); }
    .gesture.chosen::after { content: ""; position: absolute; inset: 0; background: rgba(30, 107, 214, 0.25); border-radius: 5px; }
    button:disabled { cursor: default; opacity: 0.5; }
    #start, #next { font-size: 22px; padding: 12px 28px; margin: 8px; cursor: pointer; }
    #next { visibility: hidden; }
  </style>
</head>
<body>
  <header>
    <span>Gegner: {{ label }}</span>
    <span>Du <span id="wins">{{ wins }}</span> : <span id="losses">{{ losses }}</span> Gegner</span>
  </header>

  <p id="round"></p>

  <div id="stage">
    <div id="countdown">
      <div id="word"></div>
      <div id="bar-box"><div id="bar"></div></div>
    </div>
    <!-- result: opponent on top, own hand below; all images are in the page from the start, so they are loaded before they are needed -->
    <div id="result" hidden>
      <div class="field">
        <img class="opponent" data-gesture="0" src="{% static 'study/img/opponent_'|add:opponent_set|add:'_rock.jpg' %}" alt="" hidden>
        <img class="opponent" data-gesture="1" src="{% static 'study/img/opponent_'|add:opponent_set|add:'_scissors.jpg' %}" alt="" hidden>
        <img class="opponent" data-gesture="2" src="{% static 'study/img/opponent_'|add:opponent_set|add:'_paper.jpg' %}" alt="" hidden>
      </div>
      <div class="field">
        <img class="player" data-gesture="0" src="{% static 'study/img/player_rock.jpg' %}" alt="" hidden>
        <img class="player" data-gesture="1" src="{% static 'study/img/player_scissors.jpg' %}" alt="" hidden>
        <img class="player" data-gesture="2" src="{% static 'study/img/player_paper.jpg' %}" alt="" hidden>
      </div>
    </div>
  </div>

  {% if shown_trial <= n_trials %}
    <div id="start-area"><button id="start">Start</button></div>
    <div id="choices" hidden>
      <div>
        <button class="gesture" data-choice="0"><img src="{% static 'study/img/player_rock.jpg' %}" alt=""><span>Stein</span></button>
        <button class="gesture" data-choice="1"><img src="{% static 'study/img/player_scissors.jpg' %}" alt=""><span>Schere</span></button>
        <button class="gesture" data-choice="2"><img src="{% static 'study/img/player_paper.jpg' %}" alt=""><span>Papier</span></button>
      </div>
      <button id="next">Weiter</button>
    </div>
  {% else %}
    <p>Block beendet.</p>
  {% endif %}

  <script>
    const WORDS = ["„Schere“", "„Stein“", "„Papier“"];  // countdown words
    const WORD_MS = 1125;                                // display time per word
    const LIMIT_MS = WORDS.length * WORD_MS;             // time limit = whole countdown (3375 ms); bar runs empty in this time
    const N_TRIALS = {{ n_trials }};

    let shownTrial = {{ shown_trial }};  // round number shown on the page, 1-based
    let timeouts = 0;                    // missed attempts in the current round
    let t0 = 0;                          // start of the countdown (ms)
    let active = false;                  // true while clicks on gestures count
    let choice = null;                   // current choice, null = no click yet
    let firstChoice = null;              // first clicked gesture
    let changes = 0;                     // switches to a different gesture
    let rtMs = null;                     // time of the last switch since the start of the countdown
    let timers = [];
    let waiting = false;                 // true while the result is shown and Weiter is expected
    let resultShownAt = 0;               // time when the result appeared (ms)
    let done = false;                    // true after the last round of the block

    const word = document.getElementById("word");
    const barBox = document.getElementById("bar-box");
    const bar = document.getElementById("bar");
    const countdown = document.getElementById("countdown");
    const result = document.getElementById("result");
    const nextButton = document.getElementById("next");
    const buttons = document.querySelectorAll(".gesture");
    const opponentImages = document.querySelectorAll("#result .opponent");
    const playerImages = document.querySelectorAll("#result .player");

    function setActive(value) {
      active = value;
      buttons.forEach(b => b.disabled = !value);
    }

    function clearTimers() {
      timers.forEach(clearTimeout);
      timers = [];
      barBox.style.visibility = "hidden";
    }

    function startBar() {
      bar.style.transition = "none";
      bar.style.width = "100%";
      barBox.style.visibility = "visible";
      bar.offsetWidth;  // let the browser draw the full bar before the transition starts
      bar.style.transition = `width ${LIMIT_MS}ms linear`;
      bar.style.width = "0%";
    }

    function markChoice() {
      buttons.forEach(b => b.classList.toggle("chosen", Number(b.dataset.choice) === choice));
    }

    function showOnly(images, gesture) {
      images.forEach(img => img.hidden = Number(img.dataset.gesture) !== gesture);
    }

    function startRound() {
      document.getElementById("round").textContent = `Runde ${shownTrial} von ${N_TRIALS}`;
      choice = null;
      firstChoice = null;
      changes = 0;
      rtMs = null;
      markChoice();
      result.hidden = true;
      countdown.hidden = false;
      t0 = performance.now();
      setActive(true);
      startBar();
      WORDS.forEach((w, i) => timers.push(setTimeout(() => word.textContent = w, i * WORD_MS)));
      timers.push(setTimeout(endAttempt, LIMIT_MS));
    }

    function click(gesture) {
      if (!active || gesture === choice) return;  // same gesture again does not count
      if (choice === null) firstChoice = gesture;
      else changes += 1;
      choice = gesture;
      rtMs = Math.round(performance.now() - t0);
      markChoice();
    }

    function endAttempt() {
      setActive(false);
      clearTimers();
      if (choice === null) tooSlow();
      else submit();
    }

    function tooSlow() {
      timeouts += 1;
      word.textContent = "Zu langsam";
      setTimeout(startRound, 1000);
    }

    async function submit() {
      const round = {shown_trial: shownTrial, choice: choice, first_choice: firstChoice, changes: changes, rt_ms: rtMs, timeouts: timeouts};
      let data;
      try {
        const response = await fetch("{% url 'play_round' %}", {
          method: "POST",
          headers: {"Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}"},
          body: JSON.stringify(round),
        });
        if (!response.ok) throw new Error(response.status);
        data = await response.json();
      } catch (error) {
        location.reload();  // server state is authoritative: reload continues at the next unsaved round
        return;
      }
      showResult(data);
    }

    function showResult(data) {
      showOnly(opponentImages, data.bot_move);
      showOnly(playerImages, choice);
      countdown.hidden = true;
      result.hidden = false;
      document.getElementById("wins").textContent = data.wins;
      document.getElementById("losses").textContent = data.losses;
      done = data.done;
      nextButton.style.visibility = "visible";
      resultShownAt = performance.now();
      waiting = true;
    }

    function next() {
      if (!waiting) return;
      waiting = false;
      nextButton.style.visibility = "hidden";
      const feedback = {shown_trial: shownTrial, feedback_ms: Math.round(performance.now() - resultShownAt)};
      fetch("{% url 'play_feedback' %}", {  // no waiting for the answer; if it fails, feedback_ms stays empty
        method: "POST",
        headers: {"Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}"},
        body: JSON.stringify(feedback),
        keepalive: true,
      }).catch(() => {});
      if (done) {
        result.hidden = true;
        countdown.hidden = false;
        word.textContent = "Block beendet.";
        document.getElementById("choices").hidden = true;
      } else {
        shownTrial += 1;
        timeouts = 0;
        startRound();
      }
    }

    buttons.forEach(b => b.addEventListener("click", () => click(Number(b.dataset.choice))));
    nextButton?.addEventListener("click", next);
    document.addEventListener("keydown", e => {
      if (e.code !== "Space") return;
      e.preventDefault();  // space must not press the focused button again
      next();
    });
    document.addEventListener("keyup", e => {
      if (e.code === "Space") e.preventDefault();
    });
    document.getElementById("start")?.addEventListener("click", () => {
      document.getElementById("start-area").hidden = true;
      document.getElementById("choices").hidden = false;
      startRound();
    });
  </script>
</body>
</html>
