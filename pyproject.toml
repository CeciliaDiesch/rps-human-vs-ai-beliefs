[project]
name = "rps-beliefs"
version = "0.1.0"
description = "What makes people switch strategy in rock-paper-scissors, and does it depend on believing the opponent is human or AI?"
readme = "README.md"
license = "MIT"
authors = [
    { name = "CeciliaDiesch", email = "ceciliadiesch@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 220

[tool.black]
line-length = 220

[tool.autopep8]
max_line_length = 220

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
